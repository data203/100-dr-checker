<!--
  Gold Flex Bulk Domain Rating Checker
  ====================================
  Paste everything below into a Custom HTML block, or upload as index.html.

  Needs the matching gfm-dr-worker.js deployed (batched requests).

  Worker URL already filled in:
      https://gfm-dr.loofycorwin.workers.dev/

  Whatever host this sits on must be listed in ALLOWED_ORIGINS in the worker.

  Your Ahrefs key is NOT in this file and must never be added to it.

  Spreadsheet reading and the branded Excel export load ExcelJS from cdnjs
  on demand. CSV import needs nothing external.

  The "Domain Rating by Ahrefs" credit is required by the Ahrefs Domain
  Rating License, in the widget footer and in the exported file. Leave both.
-->

<div id="dr-widget" class="gfm-dr">
	<div class="drw-head">
		<h2>Bulk Domain Rating Checker</h2>
		<p>Check the Ahrefs Domain Rating of up to 100 sites at once. Paste them in or upload a CSV or Excel file.</p>
	</div>

	<div class="drw-body">
		<label class="drw-label" for="drw-input">One domain per line</label>
		<textarea id="drw-input" rows="5" spellcheck="false" placeholder="ahrefs.com&#10;semrush.com&#10;moz.com"></textarea>
		<div class="drw-controls">
			<button type="button" class="drw-primary" id="drw-check">Check DR</button>
			<button type="button" class="drw-ghost" id="drw-clear">Clear</button>
			<button type="button" class="drw-ghost" id="drw-csv" disabled>Download Excel</button>
			<button type="button" class="drw-ghost" id="drw-copy" disabled>Copy</button>
			<input type="file" id="drw-file" accept=".csv,.txt,.xlsx,.xls" hidden>
			<label class="drw-file" for="drw-file"><span class="drw-file-txt">Upload CSV or Excel</span></label>
			<span class="drw-count" id="drw-count">0 domains</span>
		</div>
		<div class="drw-progress" id="drw-progress"><span></span></div>
		<p class="drw-progress-label" id="drw-progress-label" aria-live="polite"></p>
	</div>

	<div class="drw-results" id="drw-results">
		<p class="drw-empty">Scores will appear here.</p>
	</div>

	<div class="drw-foot">
		<span>
			Data: <a href="https://ahrefs.com/" target="_blank" rel="nofollow noopener">Domain Rating by Ahrefs</a>
			&middot; <a href="http://ahrefs.com/legal/domain-rating-license" target="_blank" rel="nofollow noopener">License</a>
		</span>
		<span id="drw-msg"></span>
	</div>
</div>

<style>
/* Gold Flex Bulk DR Checker
   Inherits the theme's typeface so the tool reads as part of the site.
   Only the DR badges and the primary button carry brand colour. */

	.gfm-dr .drw-tier { display: none; }
	.gfm-dr .drw-meter { max-width: 90px; margin-bottom: 0; }
	.gfm-dr .drw-stat { flex-basis: 45%; }

</style>

<script>
/* Gold Flex Bulk DR Checker — front end.
   Talks only to this site's own REST route; the Ahrefs key lives on the server. */
(function () {
	"use strict";

	/* Your Cloudflare Worker. Already filled in. */
	var ENDPOINT = "https://gfm-dr.loofycorwin.workers.dev/";

	/* Most domains one visitor can submit at a time. */
	var MAX_DOMAINS = 100;

	/* Domains are sent in batches, so 100 domains is 10 requests rather than
	   100. The worker looks each one up in its cache first and only calls
	   Ahrefs for the misses, in parallel, from a machine close to Ahrefs. */
	var CHUNK_SIZE = 10;
	var CHUNK_CONCURRENCY = 3;

	/* Gap between batch starts. Widened automatically if we get throttled,
	   rather than failing whatever is still queued. */
	var START_INTERVAL_MS = 250;
	var MAX_INTERVAL_MS = 3000;
	var pace = START_INTERVAL_MS;
	var REQUEST_TIMEOUT_MS = 20000;
	var RETRY_ON_BUSY = 4;
	var RETRY_DELAY_MS = 1200;

	var $ = function (id) { return document.getElementById(id); };
	var input = $("drw-input");
	if (!input) { return; }

	var btnCheck = $("drw-check");
	var btnClear = $("drw-clear");
	var btnCsv = $("drw-csv");
	var btnCopy = $("drw-copy");
	var countEl = $("drw-count");
	var resultsEl = $("drw-results");
	var progressWrap = $("drw-progress");
	var progressBar = progressWrap.querySelector("span");
	var progressLabel = $("drw-progress-label");
	var msgEl = $("drw-msg");
	var fileInput = $("drw-file");
	var fileLabel = document.querySelector(".gfm-dr .drw-file");
	var FILE_LABEL_DEFAULT = "Upload CSV or Excel";

	var results = [];
	var sortKey = "dr";
	var sortDir = -1;
	var running = false;

	/* Low to high: grey, gold, violet. */
	function tierFor(dr) {
		if (dr >= 86) return { label: "Elite", bg: "#3d1f8c", fg: "#ffffff" };
		if (dr >= 71) return { label: "Very strong", bg: "#5b32c4", fg: "#ffffff" };
		if (dr >= 51) return { label: "Strong", bg: "#8963fb", fg: "#ffffff" };
		if (dr >= 31) return { label: "Established", bg: "#ffbd00", fg: "#222225" };
		if (dr >= 11) return { label: "Growing", bg: "#ffe28a", fg: "#222225" };
		return { label: "New or low", bg: "#e7e7ec", fg: "#56565f" };
	}

	function cleanDomain(raw) {
		var s = (raw || "").trim().toLowerCase();
		if (!s) return "";
		s = s.replace(/^https?:\/\//, "").replace(/^www\./, "");
		s = s.split("/")[0].split("?")[0].split("#")[0].split(":")[0];
		return s.replace(/^[.\s]+|[,.\s]+$/g, "");
	}

	function parseInput() {
		var raw = input.value.split(/[\n,;\s]+/);
		var seen = {};
		var out = [];
		for (var i = 0; i < raw.length; i++) {
			var d = cleanDomain(raw[i]);
			if (d && d.indexOf(".") > 0 && !seen[d]) { seen[d] = 1; out.push(d); }
		}
		return out;
	}

	function updateCount() {
		var n = parseInput().length;
		var over = n > MAX_DOMAINS;
		countEl.textContent = n + (n === 1 ? " domain" : " domains") +
			(over ? " — first " + MAX_DOMAINS + " only" : "");
		countEl.className = "drw-count" + (over ? " is-over" : "");
	}

	function setMsg(text, isError) {
		msgEl.textContent = text || "";
		msgEl.className = isError ? "is-error" : "";
	}

	function escapeHtml(s) {
		return String(s).replace(/[&<>"']/g, function (c) {
			return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
		});
	}

	function sleep(ms) {
		return new Promise(function (r) { setTimeout(r, ms); });
	}

	/* One request. Resolves with a number, or rejects with a message
	   already worded for a visitor to read. */
	/* One batch. Resolves with an array of {domain, dr} or {domain, error},
	   in the order the worker returned them. */
	function fetchChunk(domains) {
		var ctrl = ("AbortController" in window) ? new AbortController() : null;
		var timer = ctrl ? setTimeout(function () { ctrl.abort(); }, REQUEST_TIMEOUT_MS) : null;

		var url = ENDPOINT + "?targets=" + encodeURIComponent(domains.join(","));
		var opts = { method: "GET", headers: { "Accept": "application/json" } };
		if (ctrl) opts.signal = ctrl.signal;

		var request = fetch(url, opts).catch(function (e) {
			// Sandboxed preview frames can't pass an AbortSignal across windows.
			if (/clone|postMessage/i.test((e && e.message) || "")) {
				delete opts.signal;
				return fetch(url, opts);
			}
			throw e;
		});

		return request.then(function (res) {
			if (timer) clearTimeout(timer);
			return res.text().then(function (text) {
				var data = null;
				try { data = JSON.parse(text); } catch (e) { /* ignore */ }

				if (!res.ok) {
					var err = new Error((data && data.error) || "Lookup failed");
					err.busy = (res.status === 429);
					throw err;
				}
				if (!data || !data.results) throw new Error("Unexpected reply");
				return data.results;
			});
		}).catch(function (err) {
			if (timer) clearTimeout(timer);
			if (err && err.name === "AbortError") throw new Error("Timed out");
			if (err instanceof TypeError) throw new Error("Connection problem");
			throw err;
		});
	}

	/* Fetch one batch, retrying the whole batch if the worker says busy. */
	function fetchChunkWithRetry(domains, attempt) {
		attempt = attempt || 0;
		return fetchChunk(domains).catch(function (err) {
			if (err.busy) {
				pace = Math.min(pace * 2, MAX_INTERVAL_MS);
				if (attempt < RETRY_ON_BUSY) {
					return sleep(RETRY_DELAY_MS * (attempt + 1)).then(function () {
						return fetchChunkWithRetry(domains, attempt + 1);
					});
				}
			}
			// Whole batch failed: report it against each domain in it.
			return domains.map(function (d) {
				return { domain: d, error: err.message || "Lookup failed" };
			});
		});
	}

	function applyResult(item, position) {
		if (item && typeof item.dr === "number") {
			var t = tierFor(item.dr);
			results[position] = {
				domain: item.domain, dr: item.dr, tier: t.label,
				bg: t.bg, fg: t.fg, status: "ok", error: ""
			};
		} else {
			results[position] = {
				domain: (item && item.domain) || results[position].domain,
				dr: null, tier: "", status: "error",
				error: (item && item.error) || "No score available"
			};
		}
	}

	function runQueue(domains) {
		var position = {};
		domains.forEach(function (d, i) { position[d] = i; });

		var chunks = [];
		for (var i = 0; i < domains.length; i += CHUNK_SIZE) {
			chunks.push(domains.slice(i, i + CHUNK_SIZE));
		}

		return new Promise(function (resolve) {
			var next = 0, active = 0, done = 0, lastStart = 0;
			var total = domains.length;

			function tick() {
				if (done === total) { resolve(); return; }
				while (active < CHUNK_CONCURRENCY && next < chunks.length) {
					var wait = Math.max(0, lastStart + pace - Date.now());
					if (wait > 0) { setTimeout(tick, wait); return; }
					lastStart = Date.now();
					active++;
					(function (chunk) {
						fetchChunkWithRetry(chunk).then(function (items) {
							// Match replies back by domain, not by array order.
							var byDomain = {};
							(items || []).forEach(function (it) {
								if (it && it.domain) byDomain[it.domain] = it;
							});
							chunk.forEach(function (d) {
								applyResult(byDomain[d] || { domain: d, error: "No reply" }, position[d]);
								done++;
							});
							active--;
							setProgress(done, total);
							renderTable();
							tick();
						});
					})(chunks[next]);
					next++;
				}
			}
			tick();
		});
	}

	function setProgress(done, total) {
		progressBar.style.width = (total ? Math.round((done / total) * 100) : 0) + "%";
		progressLabel.textContent = "Checked " + done + " of " + total;
	}

	function sortResults() {
		var rows = results.filter(Boolean).slice();
		if (running) return rows; // don't reshuffle under the reader mid-run
		return rows.sort(function (a, b) {
			if (sortKey === "domain") return a.domain.localeCompare(b.domain) * sortDir;
			var av = (a.dr == null) ? -1 : a.dr;
			var bv = (b.dr == null) ? -1 : b.dr;
			return (av - bv) * sortDir;
		});
	}

	function arrow(key) {
		if (sortKey !== key) return "";
		return ' <span class="drw-arrow">' + (sortDir === -1 ? "\u25BC" : "\u25B2") + "</span>";
	}

	function renderSummary() {
		var ok = results.filter(function (r) { return r && r.status === "ok"; });
		if (ok.length < 2) return "";

		var total = 0, best = ok[0], strong = 0;
		for (var i = 0; i < ok.length; i++) {
			total += ok[i].dr;
			if (ok[i].dr > best.dr) best = ok[i];
			if (ok[i].dr >= 51) strong++;
		}
		var avg = Math.round((total / ok.length) * 10) / 10;

		return '<div class="drw-summary">' +
			'<div class="drw-stat"><span class="drw-stat-num">' + ok.length + '</span>' +
			'<span class="drw-stat-lbl">checked</span></div>' +
			'<div class="drw-stat"><span class="drw-stat-num">' + avg + '</span>' +
			'<span class="drw-stat-lbl">average DR</span></div>' +
			'<div class="drw-stat"><span class="drw-stat-num">' + best.dr + '</span>' +
			'<span class="drw-stat-lbl">highest &mdash; ' + escapeHtml(best.domain) + '</span></div>' +
			'<div class="drw-stat"><span class="drw-stat-num">' + strong + '</span>' +
			'<span class="drw-stat-lbl">at DR 51+</span></div>' +
			"</div>";
	}

	function renderTable() {
		var rows = sortResults();
		if (!rows.length && !running) {
			resultsEl.innerHTML = '<p class="drw-empty">Scores will appear here.</p>';
			return;
		}

		var html = renderSummary() +
			'<table><thead><tr>' +
			'<th class="drw-th-num" scope="col">#</th>' +
			'<th data-sort="domain" scope="col">Domain' + arrow("domain") + '</th>' +
			'<th data-sort="dr" scope="col">DR' + arrow("dr") + '</th>' +
			'<th class="drw-th-tier" scope="col">Strength</th>' +
			'</tr></thead><tbody>';

		for (var i = 0; i < rows.length; i++) {
			var r = rows[i];
			var drCell, strengthCell;

			if (r.status === "ok") {
				drCell = '<span class="drw-badge" style="background:' + r.bg + ';color:' + r.fg + '">' +
					r.dr + "</span>";
				strengthCell =
					'<div class="drw-meter"><span style="width:' + r.dr + '%;background:' + r.bg + '"></span></div>' +
					'<span class="drw-tier">' + r.tier + "</span>";
			} else if (r.status === "pending") {
				drCell = '<span class="drw-badge drw-pending"></span>';
				strengthCell = '<div class="drw-meter drw-pending"></div>';
			} else {
				drCell = '<span class="drw-dash">\u2014</span>';
				strengthCell = '<span class="drw-status-err">' + escapeHtml(r.error) + "</span>";
			}

			html += '<tr><td class="drw-num">' + (i + 1) + "</td>" +
				'<td class="drw-domain">' + domainCell(r.domain) + "</td>" +
				"<td>" + drCell + "</td>" +
				'<td class="drw-td-tier">' + strengthCell + "</td></tr>";
		}
		resultsEl.innerHTML = html + "</tbody></table>";

		var ths = resultsEl.querySelectorAll("th[data-sort]");
		for (var j = 0; j < ths.length; j++) {
			ths[j].addEventListener("click", function () {
				if (running) return;
				var key = this.getAttribute("data-sort");
				if (sortKey === key) { sortDir *= -1; }
				else { sortKey = key; sortDir = (key === "domain") ? 1 : -1; }
				renderTable();
			});
		}
	}

	/* Only treat something as a real hostname if it survives this. */
	var HOSTNAME_RE = /^[a-z0-9]([a-z0-9-]*[a-z0-9])?(\.[a-z0-9]([a-z0-9-]*[a-z0-9])?)*\.[a-z]{2,}$/;

	function domainCell(domain) {
		var safe = escapeHtml(domain);
		if (!HOSTNAME_RE.test(domain)) return safe;
		return '<a href="https://' + safe + '" target="_blank" rel="nofollow noopener noreferrer">' +
			safe + "</a>";
	}

	/* Tab-separated: pastes straight into Excel columns, no import wizard. */
	function toTSV() {
		var rows = sortResults();
		var lines = ["#\tDomain\tDR\tTier"];
		for (var i = 0; i < rows.length; i++) {
			var r = rows[i];
			lines.push((i + 1) + "\t" + r.domain + "\t" +
				(r.dr == null ? "" : r.dr) + "\t" + (r.tier || ""));
		}
		return lines.join("\n");
	}

	/* ---------- Importing a file ---------- */

	/* ExcelJS reads .xlsx and writes the branded export. Loaded only when
	   someone actually uses a spreadsheet, so the page stays light. */
	var EXCEL_CDN = "https://cdnjs.cloudflare.com/ajax/libs/exceljs/4.4.0/exceljs.min.js";
	var excelLoading = null;

	function loadExcel() {
		if (window.ExcelJS) return Promise.resolve(window.ExcelJS);
		if (excelLoading) return excelLoading;
		excelLoading = new Promise(function (resolve, reject) {
			var tag = document.createElement("script");
			tag.src = EXCEL_CDN;
			tag.onload = function () { resolve(window.ExcelJS); };
			tag.onerror = function () { reject(new Error("Could not load the spreadsheet reader")); };
			document.head.appendChild(tag);
		});
		return excelLoading;
	}

	/* A cell value can be text, a number, a hyperlink object or rich text. */
	function cellText(v) {
		if (v == null) return "";
		if (typeof v === "object") return v.text || v.hyperlink || v.result || "";
		return String(v);
	}

	/* Pull anything domain-shaped out of arbitrary text or cells. */
	function harvestDomains(text) {
		var parts = String(text).split(/[\n\r,;\t"']+/);
		var out = [];
		for (var i = 0; i < parts.length; i++) {
			var d = cleanDomain(parts[i]);
			if (d && HOSTNAME_RE.test(d)) out.push(d);
		}
		return out;
	}

	function addDomains(list, filename) {
		if (!list.length) {
			setMsg("No domains found in " + filename, true);
			return;
		}
		var existing = input.value.trim();
		input.value = (existing ? existing + "\n" : "") + list.join("\n");
		updateCount();
		var kept = parseInput().length;
		setMsg("Loaded " + list.length + " from " + filename +
			(kept > MAX_DOMAINS ? " \u2014 only the first " + MAX_DOMAINS + " will be checked" : ""));
	}

	/* ---------- Button feedback ---------- */

	function fileLabelText(text) {
		var span = fileLabel && fileLabel.querySelector(".drw-file-txt");
		if (span) span.textContent = text;
	}

	function setUploadProgress(pct) {
		if (!fileLabel) return;
		fileLabel.classList.add("is-uploading");
		fileLabel.style.setProperty("--fill", pct + "%");
	}

	function endUpload(ok, count) {
		if (!fileLabel) return;
		setUploadProgress(100);
		fileLabel.classList.remove("is-uploading");
		fileLabel.classList.add(ok ? "is-done" : "is-failed");
		fileLabelText(ok ? "Uploaded \u2713 " + count + " found" : "Upload failed");
		setTimeout(function () {
			fileLabel.classList.remove("is-done", "is-failed");
			fileLabel.style.setProperty("--fill", "0%");
			fileLabelText(FILE_LABEL_DEFAULT);
		}, 2600);
	}

	/* Brief confirmation floating above a button. */
	function flashButton(btn, label, keepMs) {
		if (!btn) return;
		var original = btn.textContent;
		btn.setAttribute("data-toast", label);
		btn.classList.add("is-flash");
		setTimeout(function () {
			btn.classList.remove("is-flash");
			btn.removeAttribute("data-toast");
			btn.textContent = original;
		}, keepMs || 1600);
	}

	function importFile(file) {
		if (!file) return;
		var name = file.name || "file";
		var isExcel = /\.xlsx?$/i.test(name);

		if (file.size > 5 * 1024 * 1024) {
			setMsg("That file is too large (5MB limit)", true);
			endUpload(false);
			return;
		}

		fileLabelText("Reading " + name);
		setUploadProgress(12);

		if (!isExcel) {
			var reader = new FileReader();
			reader.onprogress = function (e) {
				if (e.lengthComputable) {
					setUploadProgress(12 + Math.round((e.loaded / e.total) * 60));
				}
			};
			reader.onload = function () {
				setUploadProgress(85);
				var found = harvestDomains(reader.result);
				addDomains(found, name);
				endUpload(found.length > 0, found.length);
			};
			reader.onerror = function () {
				setMsg("Could not read " + name, true);
				endUpload(false);
			};
			reader.readAsText(file);
			return;
		}

		setUploadProgress(25);
		loadExcel().then(function (ExcelJS) {
			setUploadProgress(45);
			var reader = new FileReader();
			reader.onload = function () {
				setUploadProgress(70);
				var wb = new ExcelJS.Workbook();
				wb.xlsx.load(reader.result).then(function () {
					var found = [];
					wb.eachSheet(function (sheet) {
						sheet.eachRow(function (row) {
							row.eachCell({ includeEmpty: false }, function (cell) {
								found = found.concat(harvestDomains(cellText(cell.value)));
							});
						});
					});
					addDomains(found, name);
					endUpload(found.length > 0, found.length);
				}).catch(function () {
					setMsg("Could not read that spreadsheet", true);
					endUpload(false);
				});
			};
			reader.onerror = function () {
				setMsg("Could not read " + name, true);
				endUpload(false);
			};
			reader.readAsArrayBuffer(file);
		}).catch(function (e) {
			setMsg(e.message + " \u2014 try saving as CSV instead", true);
			endUpload(false);
		});
	}

	/* ---------- Branded Excel export ---------- */

	var BRAND = {
		violet: "FF8963FB",
		violetDeep: "FF5B32C4",
		ink: "FF222225",
		line: "FFE6E3F0",
		ground: "FFFAF9FE",
		white: "FFFFFFFF"
	};

	function argb(hex) { return "FF" + String(hex).replace("#", "").toUpperCase(); }

	function thinBorder() {
		var side = { style: "thin", color: { argb: BRAND.line } };
		return { top: side, left: side, bottom: side, right: side };
	}

	function buildWorkbook(ExcelJS) {
		var rows = sortResults().filter(function (r) { return r.status === "ok"; });
		var wb = new ExcelJS.Workbook();
		wb.creator = "Gold Flex Marketing";
		wb.created = new Date();

		var ws = wb.addWorksheet("Domain Ratings", {
			views: [{ state: "frozen", ySplit: 4 }]
		});
		// #, Domain, DR, Tier
		ws.columns = [{ width: 6 }, { width: 42 }, { width: 12 }, { width: 20 }];

		// Title band, with the credit sitting on the right of the same band.
		ws.getRow(1).height = 30;
		ws.mergeCells("A1:B1");
		var title = ws.getCell("A1");
		title.value = "Bulk Domain Rating Checker";
		title.font = { bold: true, size: 15, color: { argb: BRAND.white } };
		title.alignment = { vertical: "middle", indent: 1 };

		ws.mergeCells("C1:D1");
		var powered = ws.getCell("C1");
		powered.value = {
			text: "Powered by Gold Flex Marketing",
			hyperlink: "https://goldflexmarketing.com/"
		};
		powered.font = { color: { argb: BRAND.white }, size: 10, bold: true, underline: true };
		powered.alignment = { vertical: "middle", horizontal: "right", indent: 1 };

		// The fill has to be set on every cell of a merge, not just the anchor.
		["A1", "B1", "C1", "D1"].forEach(function (ref) {
			ws.getCell(ref).fill = {
				type: "pattern", pattern: "solid", fgColor: { argb: BRAND.violetDeep }
			};
		});

		ws.mergeCells("A2:D2");
		var when = ws.getCell("A2");
		when.value = "Generated " + new Date().toLocaleDateString() +
			"  \u00b7  Data: Domain Rating by Ahrefs";
		when.font = { color: { argb: "FF6B6B78" }, size: 9 };
		when.alignment = { indent: 1 };

		ws.getRow(3).height = 6;

		// Header row
		var header = ws.getRow(4);
		header.height = 22;
		["#", "Domain", "DR", "Tier"].forEach(function (label, i) {
			header.getCell(i + 1).value = label;
		});
		header.eachCell({ includeEmpty: true }, function (cell, col) {
			cell.font = { bold: true, color: { argb: BRAND.white }, size: 11 };
			cell.fill = { type: "pattern", pattern: "solid", fgColor: { argb: BRAND.violet } };
			cell.alignment = {
				vertical: "middle",
				horizontal: (col === 1 || col === 3) ? "center" : "left",
				indent: (col === 1 || col === 3) ? 0 : 1
			};
			cell.border = thinBorder();
		});

		// Data rows
		rows.forEach(function (r, i) {
			var row = ws.addRow([i + 1, null, r.dr, r.tier]);

			var numCell = row.getCell(1);
			numCell.alignment = { horizontal: "center", vertical: "middle" };
			numCell.font = { color: { argb: "FF6B6B78" } };

			var domainCellRef = row.getCell(2);
			domainCellRef.value = { text: r.domain, hyperlink: "https://" + r.domain };
			domainCellRef.font = { color: { argb: BRAND.violetDeep }, underline: true };

			var drCell = row.getCell(3);
			drCell.numFmt = (r.dr % 1 === 0) ? "0" : "0.0";
			drCell.alignment = { horizontal: "center", vertical: "middle" };
			drCell.font = { bold: true, color: { argb: argb(r.fg) } };
			drCell.fill = { type: "pattern", pattern: "solid", fgColor: { argb: argb(r.bg) } };

			row.eachCell({ includeEmpty: true }, function (cell, col) {
				cell.border = thinBorder();
				if (col === 2 || col === 4) {
					cell.alignment = { indent: 1, vertical: "middle" };
				}
				if (col !== 3 && i % 2 === 1) {
					cell.fill = {
						type: "pattern", pattern: "solid", fgColor: { argb: BRAND.ground }
					};
				}
			});
		});

		ws.autoFilter = { from: "A4", to: "D4" };

		// Footer: the Ahrefs credit is required by their licence.
		var last = ws.rowCount + 2;
		ws.mergeCells("A" + last + ":D" + last);
		var foot = ws.getCell("A" + last);
		foot.value = {
			text: "Domain Rating by Ahrefs \u00b7 Checked with the free tool at goldflexmarketing.com",
			hyperlink: "https://goldflexmarketing.com/"
		};
		foot.font = { color: { argb: "FF6B6B78" }, size: 9 };
		foot.alignment = { indent: 1 };

		return wb;
	}

	function downloadExcel() {
		if (!results.some(function (r) { return r && r.status === "ok"; })) {
			setMsg("Nothing to export yet", true);
			return;
		}
		btnCsv.disabled = true;
		flashButton(btnCsv, "Preparing\u2026", 800);

		loadExcel().then(function (ExcelJS) {
			return buildWorkbook(ExcelJS).xlsx.writeBuffer();
		}).then(function (buffer) {
			var blob = new Blob([buffer], {
				type: "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet"
			});
			var a = document.createElement("a");
			a.href = URL.createObjectURL(blob);
			a.download = "domain-ratings-" + new Date().toISOString().slice(0, 10) + ".xlsx";
			document.body.appendChild(a);
			a.click();
			document.body.removeChild(a);
			URL.revokeObjectURL(a.href);
			btnCsv.disabled = false;
			flashButton(btnCsv, "Downloaded \u2713");
		}).catch(function (e) {
			btnCsv.disabled = false;
			setMsg("Could not build the file \u2014 use Copy instead", true);
		});
	}

	/* events */

	input.addEventListener("input", updateCount);

	if (fileInput) {
		fileInput.addEventListener("change", function () {
			importFile(this.files && this.files[0]);
			this.value = ""; // let the same file be picked again
		});
	}

	/* Dropping a file anywhere on the widget imports it. */
	var widget = document.getElementById("dr-widget");
	if (widget) {
		["dragenter", "dragover"].forEach(function (evt) {
			widget.addEventListener(evt, function (e) {
				e.preventDefault();
				widget.classList.add("is-dropping");
			});
		});
		["dragleave", "drop"].forEach(function (evt) {
			widget.addEventListener(evt, function (e) {
				e.preventDefault();
				if (evt === "dragleave" && widget.contains(e.relatedTarget)) return;
				widget.classList.remove("is-dropping");
			});
		});
		widget.addEventListener("drop", function (e) {
			if (e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files.length) {
				importFile(e.dataTransfer.files[0]);
			}
		});
	}

	btnClear.addEventListener("click", function () {
		if (running) return;
		input.value = "";
		results = [];
		updateCount();
		renderTable();
		btnCsv.disabled = true;
		btnCopy.disabled = true;
		if (fileLabel) {
			fileLabel.classList.remove("is-done", "is-failed", "is-uploading");
			fileLabel.style.setProperty("--fill", "0%");
			fileLabelText(FILE_LABEL_DEFAULT);
		}
		setMsg("");
		progressWrap.style.display = "none";
		progressLabel.style.display = "none";
	});

	btnCheck.addEventListener("click", function () {
		if (running) return;
		var domains = parseInput();
		if (!domains.length) { setMsg("Add at least one domain", true); return; }
		if (domains.length > MAX_DOMAINS) domains = domains.slice(0, MAX_DOMAINS);

		running = true;
		pace = START_INTERVAL_MS;
		results = domains.map(function (d) {
			return { domain: d, dr: null, tier: "", status: "pending", error: "" };
		});
		btnCheck.disabled = true;
		btnClear.disabled = true;
		btnCsv.disabled = true;
		btnCopy.disabled = true;
		btnCheck.innerHTML = '<span class="drw-spin"></span>';
		setMsg("");
		progressWrap.style.display = "block";
		progressLabel.style.display = "block";
		setProgress(0, domains.length);
		renderTable();

		runQueue(domains).then(function () {
			running = false;
			btnCheck.disabled = false;
			btnClear.disabled = false;
			btnCheck.textContent = "Check DR";
			var ok = results.filter(function (r) { return r && r.status === "ok"; }).length;
			var bad = results.length - ok;
			btnCsv.disabled = ok === 0;
			btnCopy.disabled = ok === 0;
			setMsg(ok + " checked" + (bad ? ", " + bad + " failed" : ""), bad > 0);
			renderTable();
			setTimeout(function () {
				progressWrap.style.display = "none";
				progressLabel.style.display = "none";
			}, 800);
		});
	});

	btnCsv.addEventListener("click", downloadExcel);

	btnCopy.addEventListener("click", function () {
		if (navigator.clipboard && navigator.clipboard.writeText) {
			navigator.clipboard.writeText(toTSV()).then(function () {
				flashButton(btnCopy, "Copied \u2713");
			});
		} else {
			setMsg("Copying is not supported in this browser", true);
		}
	});

	updateCount();
})();
</script>
